project_id = "squirrelapi-club-integration"

[api]
enabled = true
port = 56321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 56322
shadow_port = 56320
major_version = 17
health_timeout = "2m"

[db.migrations]
enabled = true

[db.seed]
enabled = false

[db.pooler]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

# Mailpit catches Auth mail locally so email-link flows run end to end; nothing leaves this machine.
[local_smtp]
enabled = true
port = 56324

[storage]
enabled = false

[auth]
enabled = true
site_url = "https://127.0.0.1:8792"
additional_redirect_urls = ["https://127.0.0.1:8792", "https://127.0.0.1:8792/auth/confirm"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
minimum_password_length = 12

# Real TOTP so tests obtain aal2 only through Auth, never by editing claims (hosted projects enable TOTP by default).
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
# Enable email/password login; global auth.enable_signup remains false.
enable_signup = true
enable_confirmations = true

# The same templates the owner pastes into the hosted dashboard (docs/email-templates).
[auth.email.template.invite]
subject = "【俱乐部数据检测平台】邀请你加入俱乐部"
content_path = "./supabase/templates/invite.html"

# The same templates the owner pastes into the hosted dashboard (docs/email-templates).
[auth.email.template.recovery]
subject = "【俱乐部数据检测平台】重置登录密码"
content_path = "./supabase/templates/reset-password.html"

[auth.rate_limit]
sign_in_sign_ups = 200
token_refresh = 200

[edge_runtime]
enabled = false

[analytics]
enabled = false
